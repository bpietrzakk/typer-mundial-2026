name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'mundial-backend/**'
  workflow_dispatch:

# one deploy at a time, in push order: a newer push waits for the running one
# and replaces any older queued run, so an older image never lands last
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # same checks as on PRs — deploy only runs when they pass
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./mundial-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mundial-backend:latest
            ghcr.io/${{ github.repository_owner }}/mundial-backend:${{ github.sha }}

      # -f fails the job on an http error, --retry covers short render hiccups.
      # the hook goes through env so the secret is not pasted into the script
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS --retry 3 --retry-delay 5 "$RENDER_DEPLOY_HOOK"
