# weekly dependency update PRs, a few at a time so they don't pile up.
# uv ecosystem (not pip) so uv.lock gets updated together with pyproject.toml
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/mundial-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/mundial-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # tailwind 4 needs a manual migration (css config, @tailwindcss/postcss), skip major bumps
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
