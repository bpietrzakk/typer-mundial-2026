# full-stack compose: postgres + FastAPI backend + nginx-served React frontend
# run from repo root:  docker compose up --build
# open http://localhost:8080
#
# needs mundial-backend/.env (cp from .env.example, fill JWT_SECRET etc.)
# for dev with hot-reload run backend/frontend locally instead and use
# mundial-backend/docker-compose.yml for just the database.

services:
  db:
    image: postgres:16
    # fixed local credentials on purpose — .env may hold the production
    # (Neon) login, and the local stack must never use it
    environment:
      POSTGRES_USER: mundial
      POSTGRES_PASSWORD: mundial
      POSTGRES_DB: mundial
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mundial -d mundial"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./mundial-backend
    env_file: ./mundial-backend/.env
    environment:
      # always talk to the local 'db' container, whatever .env says —
      # otherwise a .env with the Neon login would point local docker at
      # production and run migrations there on startup
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: mundial
      POSTGRES_PASSWORD: mundial
      POSTGRES_DB: mundial
      POSTGRES_SSL: ""
    ports:
      - "8000:8000"   # exposed for direct Swagger access at :8000/docs
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./mundial-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
