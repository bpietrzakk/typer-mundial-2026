<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />

    <!-- look switch for the trial: ?theme=classic brings back the previous
         turquoise look, ?theme=pitch the new one. remembered in localStorage -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          if (q === 'classic' || q === 'pitch') localStorage.setItem('czutka-theme', q);
          if (localStorage.getItem('czutka-theme') === 'classic') {
            document.documentElement.setAttribute('data-theme', 'classic');
          }
        } catch (e) {
          // storage blocked — default look
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>czutka — typuj wyniki meczów ze znajomymi</title>
    <meta name="description" content="czutka — typuj wyniki Ligi Mistrzów, Premier League, LaLiga, Serie A, Bundesliga i Ligue 1. Rywalizuj ze znajomymi w prywatnych ligach, zdobywaj punkty za trafione wyniki." />

    <!-- link preview (Messenger, WhatsApp, Slack...) — og:image must be an absolute URL in production -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="czutka" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:title" content="czutka — masz czutkę? Udowodnij." />
    <meta property="og:description" content="Typer wyników meczów ze znajomymi w prywatnej lidze. Liga Mistrzów i 5 top lig Europy. Bez hazardu, bez wpłat." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="czutka — masz czutkę? Udowodnij." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="czutka — masz czutkę? Udowodnij." />
    <meta name="twitter:description" content="Typer wyników meczów ze znajomymi w prywatnej lidze. Liga Mistrzów i 5 top lig Europy." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10241A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts — Inter for the UI, Outfit only for the czutka wordmark -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- register service worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(() => {
              // service worker failed — app still works without it
            });
        });
      }
    </script>
  </body>
</html>
