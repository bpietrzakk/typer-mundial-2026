[project]
name = "mundial-typer-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.0",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "resend>=2.30.1",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: real Postgres tests, run with RUN_DB_TESTS=1 (see tests/integration/conftest.py)",
]

# same lint rules for everyone (and CI), ignores personal ruff configs
[tool.ruff]
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
